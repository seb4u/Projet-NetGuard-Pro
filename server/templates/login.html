<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — NetGuard Pro</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">
        <h1>🛡️ NetGuard Pro</h1>
        <p class="subtitle">Accès administrateur</p>

        <p class="message">{{MESSAGE}}</p>

        <form method="post">
            <div class="field">
                <input type="text" name="username" placeholder="Nom d'utilisateur" required autofocus>
            </div>

            <div class="field">
                <input type="password" name="password" placeholder="Mot de passe" required>
            </div>

            <input type="hidden" name="csrf_token" id="csrf_token">

            <button type="submit">
                🔐 Se connecter
            </button>
        </form>

        <div class="footer">
            NetGuard Pro © 2026 — Secure Monitoring
        </div>
    </div>

</div>

<script src="/static/js/login.js"></script>
</body>
</html>
